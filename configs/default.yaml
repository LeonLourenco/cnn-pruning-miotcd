# Protocolo comum dos 6 experimentos (ver docs/SPEC.md).
# Qualquer mudanca aqui vale para TODOS os experimentos e deve ser combinada entre os dois.

data:
  split_csv: data/splits/split.csv
  img_root: data/processed/mio_subset   # <img_root>/<classe>/<id>.jpg
  img_size: 112
  num_workers: 2
  classes: [articulated_truck, background, bicycle, bus, car, motorcycle,
            non-motorized_vehicle, pedestrian, pickup_truck, single_unit_truck, work_van]

model:
  arch: resnet18
  pretrained: true            # pesos do ImageNet

baseline:                     # Exp 1
  epochs: 20
  batch_size: 128
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine

finetune:                     # Exp 2-6, apos a poda (one-shot)
  epochs: 10                  # era 5 ate 18/11: F1 de validacao ainda subia na 5a epoca (docs/SPEC.md, sec. 4)
  batch_size: 128
  optimizer: sgd
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine

selection_metric: f1_macro    # checkpoint escolhido pelo melhor F1-macro na VALIDACAO

seeds: [0]                    # escopo atual; sementes 1 e 2 sao demanda (docs/DEMANDAS.md)

structured:                   # Exp 5 e 6 (Leon)
  ratio: 0.5                  # fracao de canais removida em cada camada
  importance: l1              # norma L1 dos filtros
  ignore: [conv1, fc]         # camadas que nao sao podadas

unstructured:                 # Exp 2-4 (Gabriel) - criterios a definir, ver docs/DEMANDAS.md
  amounts: [0.3, 0.6, 0.9]
  scope: null                 # global | layer  (A DEFINIR)
  ignore: null                # ex.: [conv1, fc] (A DEFINIR)

latency:                      # medido SOMENTE no notebook do Leon, Python nativo do Windows
  threads: 4
  batch_sizes: [1, 32]
  warmup: 50
  iters: 300
